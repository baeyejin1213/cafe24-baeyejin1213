<script>
    (function () {
        function changeOrderText() {
            var orderSelect = document.querySelector('.searchOrder select#order_by');

            if (!orderSelect) return;

            var firstOption = orderSelect.querySelector('option[value=""]');

            if (firstOption) {
                firstOption.textContent = '상품정렬';
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', changeOrderText);
        } else {
            changeOrderText();
        }

        setTimeout(changeOrderText, 300);
        setTimeout(changeOrderText, 1000);
    })();
</script>
