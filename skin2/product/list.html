<div class="list_wrap">

    <!-- 분류 01 : 타이틀 -->
    <div class="list_title" module="product_headcategory">
        <div class="title_wrap">
            <div module="Layout_MobileAction">
                <a href="#none" onclick="{$go_back}"><!--@import(/morenvyimg/list_back.svg)--><span>뒤로가기</span></a>
            </div>
            <h2>{$title_text_or_image}</h2>
        </div>
    </div>

    <!-- 분류 02 : 하위 분류 탭 -->
    <div class="swiper swiper_title_tab">
        <ul class="title_tab swiper-wrapper">
            <li module="product_displaycategory" style="display:{$display};" class="{$selected} swiper-slide">
                <a href="{$link_product_list_sub}">{$category_name}</a>
            </li>
        </ul>
    </div>

    <!-- 분류 03 : 상단 이미지 -->
    <div class="list_ban">
        <div module="product_headcategory" class="product_top_image">{$top_image1_tag}{$top_image2_tag}{$top_image3_tag}</div>
    </div>

    <!-- 분류 04 : 추천상품 -->
    <div module="product_listrecommend" class="ec-base-product list_slide list_recmd">
        <!--
            $count = 8
        -->
        <div class="l_title">
            <!-- 분류 : 추천상품 타이틀 -->
            <!--@import(/section/list_recmd_title.html)-->
        </div>
        <div class="swiper swiper_recmd">
            <ul class="prdList swiper-wrapper">
                <!--@import(/product/product_list.html)-->
            </ul>
        </div>
    </div>

    <!-- 분류 05 : 신상품 -->
    <div module="product_listnew" class="ec-base-product list_slide list_new">
        <!--
            $count = 8
        -->
        <div class="l_title">
            <!-- 분류 : 신상품 타이틀 -->
            <!--@import(/section/list_new_title.html)-->
        </div>
        <div class="swiper swiper_new">
            <ul class="prdList swiper-wrapper">
                <!--@import(/product/product_list.html)-->
            </ul>
        </div>
    </div>

    <!-- 분류 06 : 상품 목록 -->
    <div class="list_prd">
        <!--@import(/product/shoppQ/searchContent.html)-->
        <div module="product_normalpackage">
            <!--@css(/css/module/product/listnormal.css)-->
            <!--@js(/js/module/product/normalmenu.js)-->
            <div module="product_normalmenu">
                <!--
                    $compare_page = /product/compare.html
                -->
                <div class="function" id="{$listmenu_position}">
                    <p class="prdCount"><span class="mo_only">총 </span><strong>{$total_count}</strong><span class="pc_only">개의 제품</span><span class="mo_only"> 개의 상품이 있습니다.</span></p>
                    <div class="sort">
                        <select id="selArray" name="selArray" module="product_Orderby">
                            <option value>기본 정렬</option>
                            <option value="{$param}">{$sort_name}</option>
                            <option value="{$param}">{$sort_name}</option>
                        </select>
                    </div>
                </div>
                <fieldset class="condition {$select_search_display|display}">
                    <legend>조건별 검색</legend>
                    <p>
                        <!--@js(/js/module/product/product_selectsearch.js)-->
                        <select class="FirstSelect" module="product_FirstSelect">
                            <option value>-조건선택-</option>
                            <option value="{$value}" {$selected}>{$title}</option>
                            <option value="{$value}" {$selected}>{$title}</option>
                        </select>
                        <select class="SecondSelect" module="product_SecondSelect">
                            <option value>-조건선택-</option>
                            <option value="{$value}" {$selected}>{$title}</option>
                            <option value="{$value}" {$selected}>{$title}</option>
                        </select>
                        <a href="#SelectSearch" class="btnSubmitFix">검색</a>
                    </p>
                </fieldset>
            </div>
            <div module="product_listnormal" class="ec-base-product">
                <!--
                    $count = 20
                    $cache = no
                    ※ 상품진열갯수를 설정하는 변수입니다. 설정하지 않을 경우, 최대 200개의 상품이 진열 됩니다.
                    ※ 진열된 상품이 많으면, 쇼핑몰에 부하가 발생할 수 있습니다.

                    $basket_result = /product/add_basket.html
                    $basket_option = /product/basket_option.html
                -->
                <ul class="prdList prdList_normal">
                    <!--@import(/product/product_list.html)-->
                </ul>
            </div>
        </div>

        <!-- 분류 07 : 페이지 번호 -->
        <div module="product_normalpaging" class="ec-base-paginate list_paging">
            <a href="{$param_first}" class="first"><!--@import(/morenvyimg/list_page2.svg)--><span>첫 페이지</span></a>
            <a href="{$param_before}" class="prev"><!--@import(/morenvyimg/list_page.svg)--><span>이전 페이지</span></a>
            <ol>
                <li><a href="{$param}" class="{$param_class}">{$no}</a></li>
                <li><a href="{$param}" class="{$param_class}">{$no}</a></li>
                <li><a href="{$param}" class="{$param_class}">{$no}</a></li>
                <li><a href="{$param}" class="{$param_class}">{$no}</a></li>
                <li><a href="{$param}" class="{$param_class}">{$no}</a></li>
            </ol>
            <a href="{$param_next}" class="next"><!--@import(/morenvyimg/list_page.svg)--><span>다음 페이지</span></a>
            <a href="{$param_last}" class="last"><!--@import(/morenvyimg/list_page2.svg)--><span>마지막 페이지</span></a>
        </div>
    </div>

</div>
<!-- //list_wrap -->

<script>
    /* 상품이 없을 때 안내 문구 */
    (function () {
        function checkEmptyProductList() {
            var listWrap = document.querySelector('.list_prd');
            if (!listWrap) return;

            var normalPackage = listWrap.querySelector('.xans-product-normalpackage');
            var prdList = listWrap.querySelector('.prdList_normal');
            var paging = listWrap.querySelector('.list_paging');
            var emptyMessage = listWrap.querySelector('.js-empty-product-message');
            var hasProduct = !!(prdList && prdList.querySelector('li[id^="anchorBoxId_"]'));

            if (!hasProduct) {
                if (!emptyMessage) {
                    emptyMessage = document.createElement('p');
                    emptyMessage.className = 'message js-empty-product-message';
                    emptyMessage.textContent = '등록된 상품이 없습니다.';
                    if (prdList) prdList.insertAdjacentElement('afterend', emptyMessage);
                    else if (normalPackage) normalPackage.appendChild(emptyMessage);
                    else listWrap.appendChild(emptyMessage);
                }
                if (prdList) prdList.style.display = 'none';
                if (paging) paging.style.display = 'none';
            } else {
                if (emptyMessage) emptyMessage.remove();
                if (prdList) prdList.style.display = '';
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', checkEmptyProductList);
        } else {
            checkEmptyProductList();
        }
        window.addEventListener('load', checkEmptyProductList);
    })();
</script>
