<!-- 메인 : 팝업 -->
<!-- 앱스토어 - 배너관리자 - [메인 : 팝업] 에서 수정가능합니다 -->
<div class="main_popup">
	<div class="popup">
		<div class="top">
			<div class="swiper popup-swiper morenvy-banner-area" area_id="bb12">
				<div class="swiper-wrapper">
					<div class="swiper-slide morenvy-banner">
						<a href="{#link_1}" target="{#target_1}">
							<div class="img">
								{#imgTag_1}
							</div>
							<div class="txt">
								<h2 style="color: {#text_2}">{#title}</h2>
								<p style="color: {#text_2}">{#text_1}</p>
							</div>
						</a>
					</div>
				</div>

				<div class="swiper-pagination"></div>
			</div>
		</div>
		<div class="bottom">
			<div class="btn_wrap">
				<a href="#none" class="notToday">오늘 하루 보지 않기</a>
				<div class="btn_close">닫기</div>
			</div>
		</div>
	</div>
</div>

<!-- 메인 01 : 키비주얼 -->
<!-- 앱스토어 - 배너관리자 - [메인 : 키비주얼] 에서 수정가능합니다 -->
<section class="main_visual">
    <div class="swiper_wrap">
        <div class="swiper swiper_visual morenvy-banner-area" area_id="c185">
            <div class="swiper-wrapper">
                <div class="swiper-slide morenvy-banner m_ban">
                    <a href="{#link_1}" target="{#target_1}">
                        <div class="bg">
                            <picture>
                                <source srcset="{#imgSrc_2}" media="(max-width: 1024px)">
                                {#imgTag_1}
                            </picture>
                        </div>
                        <!-- 원본 텍스트 데이터 (스크립트로 가져오기 위해 숨김 처리됨) -->
                        <div class="txt origin_txt">
                            <h2>{#title}</h2>
                            <p>{#text_1}</p>
                            <button type="button">{#text_2}</button>
                            <span class="slide_link">{#link_1}</span>
                            <span class="slide_target">{#target_1}</span>
                        </div>
                    </a>
                </div>
            </div>

            <div class="fixed_txt_box">
                <div class="swiper-pagination swiper-pagination-visual"></div>
                <a href="#" class="fixed_link">
                    <div class="txt">
                        <h2 class="fixed_title"></h2>
                        <p class="fixed_desc"></p>
                        <button type="button" class="fixed_btn"></button>
                    </div>
                </a>
            </div>
        </div>
        <div class="swiper_btn_wrap swiper_btn_wrap_visual pc_only">
            <div class="swiper-button swiper-button-prev swiper-button-prev-main"><!--@import(/morenvyimg/icon/wh_arr_l.svg)--></div>
            <div class="swiper-button swiper-button-next swiper-button-next-main"><!--@import(/morenvyimg/icon/wh_arr_l.svg)--></div>
        </div>
    </div>
</section>
