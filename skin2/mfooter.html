    - 메뉴 /section/f_menu.html, 약관 /section/f_terms.html, SNS /section/f_sns.html, 패밀리사이트는 아래 f_family 목록에서 수정

<div class="footer-wrap">
	<footer id="footer" class="gg_footer" module="Layout_footer">
		<div class="f_inner">
			<div class="f_left">
				<!-- 하단 : 메뉴 -->
				<ul class="f_line f_menu">
					<!--@import(/section/f_menu.html)-->
				</ul>

				<div class="f_info_wrap">
					<ul class="f_line f_sub">
						<li><button type="button" class="f_biz_btn">{$company_name} 사업자 정보<!--@import(/morenvyimg/f_arr_up.svg)--></button></li>
						<!-- 하단 : 이용약관 -->
						<!--@import(/section/f_terms.html)-->
					</ul>
					<div class="f_info">
						<p>대표자 : {$president_name}</p>
						<p>주소 : {$mall_zipcode} {$mall_addr1} {$mall_addr2}</p>
						<p>대표전화 : {$phone}</p>
						<p>사업자등록번호 : {$company_regno}<span class="com_regno_btn">{$biz_no_link}</span></p>
						<p>통신판매신고번호 : {$network_regno}</p>
					</div>
				</div>
			</div>

			<div class="f_right">
				<div class="f_right_top">
					<div class="f_family">
						<button type="button">FAMILY SITE<!--@import(/morenvyimg/f_arr_up.svg)--></button>
						<ul>
							<!-- 하단 : 패밀리 사이트 수정 -->
							<li><a href="https://morenvy.com" target="_blank">MORENVY</a></li>
						</ul>
					</div>
					<ul class="f_sns">
						<!-- 하단 : sns -->
						<!--@import(/section/f_sns.html)-->
					</ul>
				</div>
				<p class="copy">COPYRIGHT {$company_name}.<br> ALL RIGHTS RESERVED DESIGNED BY. MORENVY</p>
				<!-- 모바일 : 이용약관 (맨 아래) -->
				<ul class="f_line f_terms_m">
					<!--@import(/section/f_terms.html)-->
				</ul>
			</div>
		</div>
	</footer>
</div>

<!-- 모바일 : 하단 고정바 -->

		<li><a href="/myshop/index.html" title="마이페이지"><!--@import(/morenvyimg/fx_my.svg)--></a></li>
	</ul>
</div>
