<div module="coupon_productdetailajax">
    <!--
        $coupon_down_result_url = /coupon/coupon_down_result.html
    -->
    <button type="button" class="coupon_btn">쿠폰받기<!--@import(/morenvyimg/detail_coupon.svg)--></button>

    <div id="coupon_pop" class="layer_pop">
        <div class="pop_title">
            <h3>쿠폰받기</h3>
            <button type="button" class="pop_close" title="닫기"><!--@import(/morenvyimg/list_close24.svg)--></button>
        </div>
        <div class="couponSkinArea">
            <ul class="grid1">
                <li>
                    <div class="coupon {$background_class}">
                        <div class="detail" {$call_coupon_detail}>
                            <strong class="title">{$coupon_name}</strong>
                            <p class="discount">{$coupon_content}</p>
                            <p class="period">{$coupon_period}</p>
                        </div>
                        <div class="button"><a href="{$coupon_issue_url}" title="다운받기"><!--@import(/morenvyimg/coupon.svg)-->다운받기</a></div>
                    </div>
                </li>
                <li>
                    <div class="coupon {$background_class}">
                        <div class="detail" {$call_coupon_detail}>
                            <strong class="title">{$coupon_name}</strong>
                            <p class="discount">{$coupon_content}</p>
                            <p class="period">{$coupon_period}</p>
                        </div>
                        <div class="button"><a href="{$coupon_issue_url}" title="다운받기"><!--@import(/morenvyimg/coupon.svg)-->다운받기</a></div>
                    </div>
                </li>
            </ul>
            <a href="#none" id="btn_all_coupondown" class="btnNormal">전체 쿠폰 받기</a>
        </div>
    </div>
</div>
