<!-- 상단 : 텍스트 띠배너 -->
<!-- 앱스토어 - 배너관리자 - [상단 : 텍스트 띠배너] 에서 수정가능합니다 -->
<div class="txt_ban2 morenvy-banner-area" area_id="cf00">
	<div class="morenvy-banner inner">
		<a href="{#link_1}"><span>{#title}</span></a>
		<span class="btn_close"><!--@import(/morenvyimg/icon/text_ban_close_24.svg)--></span>
	</div>
</div>


<header id="header" class="h_type01">
	<div class="h_inner">
		<!-- 상단 : 로고 -->
		<!-- 앱스토어 - 배너관리자 - [상단 : 로고] 에서 수정가능합니다 -->
		<div class="h_logo morenvy-banner-area" area_id="8626">
			<div class="morenvy-banner">
				<a href="{#link_1}">{#title}</a>
			</div>
		</div>

		<!-- 상단 : 가운데 메뉴 (PC) -->
		<nav class="h_gnb">
			<ul class="h_cate" module="Layout_category">
				<li><a href="{$link_product_list}" cate="{$param}">{$name}</a></li>
				<li><a href="{$link_product_list}" cate="{$param}">{$name}</a></li>
			</ul>
			<span class="bar"></span>
			<ul class="h_add">
				<!-- 상단 : 추가 메뉴 -->
				<!--@import(/section/h_add_menu.html)-->
			</ul>
		</nav>

		<!-- 상단 : 아이콘 -->
		<ul class="h_util">
			<li class="menu"><a href="#none" title="전체메뉴"><!--@import(/morenvyimg/h_menu.svg)--></a></li>
			<li class="user" module="Layout_statelogoff"><a href="/member/login.html" title="로그인"><!--@import(/morenvyimg/h_user.svg)--></a></li>
			<li class="user" module="Layout_statelogon"><a href="/myshop/index.html" title="마이페이지"><!--@import(/morenvyimg/h_user.svg)--></a></li>
			<li class="cart"><a href="/order/basket.html" title="장바구니"><!--@import(/morenvyimg/h_cart.svg)--></a></li>
			<li class="search"><a href="#none" title="검색"><!--@import(/morenvyimg/h_search.svg)--></a></li>
		</ul>
	</div>

	<!-- 상단 : 메가메뉴 -->
	<div class="h_mega"></div>
</header>


<!-- 상단 : 검색 (오른쪽 사이드) -->
<div class="search_box type01" module="Layout_SearchHeader">
	<!--
		$product_page=/product/detail.html
		$category_page=/product/list.html
	-->
	<div class="sch_head">
		<h2>검색</h2>
		<button type="button" class="sch_close" title="닫기"><!--@import(/morenvyimg/side_close.svg)--></button>
	</div>
	<div class="sch_body">
		<!-- 검색창 : 문구 수정 -->
		<!--@import(/section/h_search.html)-->
			<legend>검색</legend>
			{$form.keyword}
			<a href="#none" class="btn_sch" onclick="{$action_search_submit}" title="검색"><!--@import(/morenvyimg/h_search.svg)--></a>
		</fieldset>

		<div class="hot_keyword">
			<h3>인기 검색어</h3>
			<ul module="search_hotkeyword">
				<li><a href="{$hot_keyword_url}">{$hot_keyword_name}</a></li>
				<li><a href="{$hot_keyword_url}">{$hot_keyword_name}</a></li>
			</ul>
		</div>

		<div class="recent_keyword">
			<h3>최근 검색어<span>전체삭제</span></h3>
			<ul></ul>
		</div>
	</div>
</div>

<!-- 검색 : 최근 본 상품 -->
<div class="sch_recent">
	<h3>최근 본 상품<a href="/product/recent_view_product.html">전체보기</a></h3>
	<div module="Layout_productRecent" class="swiper">
		<ul class="swiper-wrapper">
			<li class="swiper-slide {$disp_recent|display}"><a href="/product/detail.html{$param}"><img src="{$recent_img}" alt="{$name}" /></a></li>
			<li class="swiper-slide {$disp_recent|display}"><a href="/product/detail.html{$param}"><img src="{$recent_img}" alt="{$name}" /></a></li>
		</ul>
	</div>
</div>

<div class="h_dim"></div>
