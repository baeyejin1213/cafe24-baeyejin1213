<!--@layout(/layout/basic/layout.html)-->
<!--@js(/board/brand/brand_list2.js)-->
<!--@css(/board/brand/brand.css)-->
<div module="Board_ListPackage_1002">
    <div module="board_title_1002">
        <div class="path">
            <span>현재 위치</span>
            <ol>
                <li><a href="/">홈</a></li>
                 <li><a href="javascript:;" style="cursor:auto; color:#1f1f1f">브랜드 수정</a></li>
            </ol>
        </div>

        <div class="titleArea">
            <h2>브랜드 수정 페이지</h2>
            <p>수정하실 브랜드를 선택해 주세요.</p>
        </div>
    </div>

    <div class="ec-base-table typeList gBorder">
        <table border="1" summary="">
            <caption>게시판 목록</caption>
            <colgroup module="board_listheader_1002">
                <col style="width:70px;" />
                <col style="width:200px;" class="{$config.is_category|display}" />
				<col style="width:200px;" />
				<col style="width:200px;" />
                <col style="width:200px;" />
            </colgroup>
            <thead module="board_listheader_1002">
                <tr style="{$list_bg_color} {$list_char_color}">
                    <th scope="col">번호</th>
                    <th scope="col" class="{$config.is_category|display}">카테고리</th>
					<th scope="col">영문명</th>
					<th scope="col">한글명</th>
					<th scope="col">연결할 카테고리 번호 or 연결할 URL 주소</th>
                </tr>
            </thead>
            <tbody module="board_list_1002" class="center" id="brand_list">
                <!--
                    $login_page_url = /member/login.html
                    $deny_access_url = /index.html
                -->
                <tr style="{$list_bg_color} {$list_char_color}">
                    <td>{$no}<span class="brand_data displaynone">{$subject}</span></td>
                    <td class="{$category_display|display}">{$category_name}</td>
   					<td><a href="/board/brand/modify.html{$param_read}"><span id="brand_en"></span></a></td>
					<td><a href="/board/brand/modify.html{$param_read}"><span id="brand_kr"></span></a></td>
					<td><a href="/board/brand/modify.html{$param_read}"><span id="brand_category_no"></span></a></td>
                </tr>
                <tr style="{$list_bg_color} {$list_char_color}">
                    <td>{$no}<span class="brand_data displaynone">{$subject}</span></td>
                    <td class="{$category_display|display}">{$category_name}</td>
   					<td><a href="/board/brand/modify.html{$param_read}"><span id="brand_en"></span></a></td>
					<td><a href="/board/brand/modify.html{$param_read}"><span id="brand_kr"></span></a></td>
					<td><a href="/board/brand/modify.html{$param_read}"><span id="brand_category_no"></span></a></td>
                </tr>
            </tbody>
        </table>
        <p class="message {$empty_display|display}" module="board_empty_1002">{$empty_message}</p>
    </div>
    <div module="board_ButtonList_1002" class="ec-base-button typeBG {$write_display|display}">
        <span class="gRight">
            <a href="/board/brand/write.html{$param_write}" class="brand_btn {$write_display|display}">브랜드 등록</a>
        </span>
    </div>
</div>

<div module="board_paging_1002" class="ec-base-paginate">
    <a href="{$param_prev}"><img src="//img.echosting.cafe24.com/skin/base/common/btn_page_prev.gif" alt="이전 페이지" /></a>
    <ol>
        <li><a href="{$param_num}" class="{$param_class}">{$page_num}</a></li>
        <li><a href="{$param_num}" class="{$param_class}">{$page_num}</a></li>
    </ol>
    <a href="{$param_next}"><img src="//img.echosting.cafe24.com/skin/base/common/btn_page_next.gif" alt="다음 페이지" /></a>
</div>

<div module="board_search_1002">
    <!--@css(/css/module/board/search.css)-->
    <fieldset class="boardSearch">
        <legend>게시물 검색</legend>
        <p>{$form.search_date} {$form.search_key} {$form.search} <a href="#none" class="btnEmFix" onclick="{$action_search}">찾기</a></p>
    </fieldset>
</div>
