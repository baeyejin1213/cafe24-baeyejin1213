<!-- 하단 -->
<footer id="footer" module="Layout_footer">
    <div class="f_inner">
        <!-- 하단 : 영역 01 -->
        <div class="f_sec01">
            <div class="f_left">
                <div class="f_logo_wrap">
                    <!-- 하단 : 로고 -->
                    <!-- 앱스토어 - 배너관리자 - [하단 : 로고] 에서 수정가능합니다 -->
                    <div class="f_logo morenvy-banner-area" area_id="e5d1">
                        <div class="morenvy-banner">
                            <a href="{#link_1}">{#imgTag_1}</a>
                        </div>
                    </div>
                    <button type="button" class="btn_info"><img src="/morenvyimg/cs_arr_d.svg" alt="이용약관·고객센터 접기/펼치기"></button>
                </div>
            </div>

            <div class="f_right">
                <!-- 하단 : 메뉴 (모바일에서는 [고객 서비스] 를 눌러 펼침) -->
                <button type="button" class="f_menu_tit">고객 서비스<img src="/morenvyimg/cs_arr_d.svg" alt=""></button>
                <ul class="f_menu">
                    <!--@import(/section/f_menu.html)-->
                </ul>
            </div>
        </div>

        <!-- 하단 : 영역 02 -->
        <div class="f_sec02">
            <ul class="terms">
                <!-- 하단 : 이용약관 -->
                <!--@import(/section/f_terms.html)-->
            </ul>

            <ul class="f_cs">
                <!-- 하단 : 고객센터 -->
                <!--@import(/section/f_cs.html)-->
            </ul>
        </div>

        <!-- 하단 : 영역 03 -->
        <div class="f_sec03">
            <!-- 하단 : 정보 -->
            <div class="f_info">
                <ul class="company">
                    <li><p>{$company_name}</p><p>대표 : {$president_name}</p></li>
                    <li><p>주소 : {$mall_zipcode} {$mall_addr1} {$mall_addr2}</p><p>사업자등록번호 : {$company_regno}</p><p class="com_regno_btn">{$biz_no_link}</p><p>통신판매업신고번호 : {$network_regno}</p></li>
                    <li><p>개인정보처리책임자 : {$cpo_name}</p><p>이메일 : {$cpo_email}</p></li>
                </ul>
            </div>

            <div class="f_etc">
                <ul class="f_sns">
                    <!-- 하단 : sns -->
                    <!--@import(/section/f_sns.html)-->
                </ul>

                <div class="f_family">
                    <button type="button">패밀리 사이트<img src="/morenvyimg/cs_arr_d.svg" alt=""></button>
                    <ul>
                        <!-- 하단 : 패밀리 사이트 -->
                        <!--@import(/section/f_family.html)-->
                    </ul>
                </div>
            </div>
        </div>
    </div>
</footer>
