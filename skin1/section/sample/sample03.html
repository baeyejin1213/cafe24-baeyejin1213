<script>
    /* 카페24 jQuery 는 본문 뒤에서 불러오므로 바닐라 JS + DOMContentLoaded 로 실행 */
    document.addEventListener("DOMContentLoaded", function () {
        var wrap = document.getElementById("pj_roem_m");
        if (!wrap) return;
        var hasIo = "IntersectionObserver" in window;

        /* ── 이미지맵 : 이미지가 원본 크기보다 작게 보이면 좌표도 같은 비율로 축소 ── */
        var resizeMaps = function () {
            wrap.querySelectorAll("img[usemap]").forEach(function (img) {
                if (!img.naturalWidth) return;
                var map = wrap.querySelector('map[name="' + img.getAttribute("usemap").replace("#", "") + '"]');
                if (!map) return;
                var ratio = img.clientWidth / img.naturalWidth;
                map.querySelectorAll("area").forEach(function (area) {
                    if (!area.getAttribute("data-coords")) area.setAttribute("data-coords", area.getAttribute("coords"));
                    area.setAttribute("coords", area.getAttribute("data-coords").split(",").map(function (v) { return Math.round(v * ratio); }).join(","));
                });
            });
        };
        wrap.querySelectorAll("img[usemap]").forEach(function (img) { img.addEventListener("load", resizeMaps); });
        window.addEventListener("resize", resizeMaps);
        resizeMaps();

        /* ── 메인 비주얼 : 이미지만 줌인하면서 등장 ── */
        var hero = wrap.querySelector(".rm_top .hero");
        if (hasIo) {
            var heroIo = new IntersectionObserver(function (entries) {
                if (entries[0].isIntersecting) {
                    hero.classList.add("on");
                    heroIo.disconnect();
                }
            }, {threshold: 0.2});
            heroIo.observe(hero);
        } else {
            hero.classList.add("on");
        }

        /* ── 찰나 영상 : 자동재생 (모바일 자동재생 조건 muted + playsinline 을 속성으로도 지정) ── */
        var video = wrap.querySelector(".rm_video video");
        video.muted = true;
        video.setAttribute("playsinline", "");
        var playVideo = function () {
            var p = video.play();
            if (p && p.catch) p.catch(function () { video.setAttribute("controls", ""); }); /* 자동재생이 막히면(저전력 모드 등) 재생 버튼 노출 */
        };
        if (hasIo) {
            new IntersectionObserver(function (entries) {
                if (entries[0].isIntersecting) playVideo(); else video.pause();
            }, {threshold: 0.2}).observe(video);
        } else {
            playVideo();
        }

        /* ── Swiper : 이미지 롤링(슬라이드) / 오브젝트 안 이미지 페이드 교체 — 뷰포트에 들어오면 autoplay 시작 ── */
        if (typeof Swiper === "undefined") return;
        var swipers = [];
        wrap.querySelectorAll(".swiper").forEach(function (el, i) {
            var option = {
                loop: true,
                speed: 700,
                autoplay: {delay: 3000, disableOnInteraction: false},
            };
            if (el.classList.contains("mirror")) {
                option.effect = "fade";
                option.fadeEffect = {crossFade: false}; /* true 면 전환 중 두 장이 다 반투명 → 배경이 비침 (오브젝트 모양이 같아 이전 컷 위로 덮어도 자연스러움) */
                option.allowTouchMove = false;
            }
            var swiper = new Swiper(el, option);
            swiper.autoplay.stop(); /* 뷰포트에 들어오기 전엔 정지 */
            el.setAttribute("data-index", i);
            swipers.push(swiper);
        });

        if (hasIo) {
            var swiperIo = new IntersectionObserver(function (entries) {
                entries.forEach(function (e) {
                    var swiper = swipers[e.target.getAttribute("data-index")];
                    if (e.isIntersecting) {
                        if (!swiper.autoplay.running) swiper.autoplay.start();
                    } else if (swiper.autoplay.running) {
                        swiper.autoplay.stop();
                    }
                });
            }, {threshold: 0.3});
            wrap.querySelectorAll(".swiper").forEach(function (el) { swiperIo.observe(el); });
        } else {
            swipers.forEach(function (swiper) { swiper.autoplay.start(); });
        }
    });
</script>
