<style>
    /* 공통 */
    #container #contents {max-width: none; padding: 0;}
    .project_box {overflow: hidden;}
    .project_box > div {position: relative; font-size: 0; line-height: 0;}
    .project_box img {display: block; width: 100%; max-width: none;}
    .project_box .swiper-container {position: relative; overflow: hidden;}
    .project_box .img_box {position: absolute; top: 30.7803%; left: 17.2667%; z-index: 1; width: 65.4667%; overflow: hidden;}
    .project_box .img_box img {transition: .6s; transform: scale(1.2); opacity: 0;}
    .project_box .img_box.on img {transform: scale(1); opacity: 1;}

    /* 기획전 섹션 03 */
    .project_box .p_sec03 {aspect-ratio: 720 / 1280; overflow: hidden; background-color: #d9d9d9;}
    .project_box .p_sec03 video {display: block; width: 100%; height: 100%; object-fit: cover;}
</style>

<script>
    $(document).ready(function () {
        /* swiper */
        function exactWidth(container) {
            return document.querySelector(container).getBoundingClientRect().width;
        };

        function swiperCreator(options) {
            var swiper = new Swiper(options.container, {
                width: exactWidth(options.container),
                slidesPerView: 1,
                loop: true,
                autoplay: {
                    delay: 3000,
                    disableOnInteraction: false,
                },
                speed: 700,
            });

            return swiper;
        };

        if (typeof Swiper !== "undefined") {
            var swipers = [
                swiperCreator({container: ".project_box .swiper01"}),
                swiperCreator({container: ".project_box .swiper02"}),
                swiperCreator({container: ".project_box .swiper03"}),
                swiperCreator({container: ".project_box .swiper04"}),
                swiperCreator({container: ".project_box .swiper05"}),
                swiperCreator({container: ".project_box .swiper06"}),
            ];

            window.addEventListener("resize", function () {
                swipers.forEach(function (swiper) {
                    swiper.params.width = swiper.el.getBoundingClientRect().width;
                    swiper.update();
                });
            });
        }

        /* 이미지 줌인 */
        document.querySelectorAll(".project_box .img_box").forEach(function (el) {
            var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        el.classList.add("on");
                    };
                });
            }, {
                threshold: 0.3
            });

            observer.observe(el);
        });

        /* 영상 */
        var video = document.querySelector(".project_box .p_sec03 video");
        if (video) {
            video.muted = true;
            var p = video.play();
            if (p && p.catch) p.catch(function () { video.setAttribute("controls", ""); });
        }

        /* 이미지맵 */
        function imageMapResize() {
            document.querySelectorAll(".project_box img[usemap]").forEach(function (img) {
                if (!img.naturalWidth) return;
                var ratio = img.clientWidth / img.naturalWidth;
                document.querySelectorAll('map[name="' + img.getAttribute("usemap").slice(1) + '"] area').forEach(function (area) {
                    if (!area.dataset.coords) area.dataset.coords = area.getAttribute("coords");
                    area.setAttribute("coords", area.dataset.coords.split(",").map(function (v) { return Math.round(v * ratio); }).join(","));
                });
            });
        };

        window.addEventListener("load", imageMapResize);
        window.addEventListener("resize", imageMapResize);
    });
</script>
