<script>
    $(document).ready(function () {
        /* swiper */
        function exactWidth(container) {
            var el = document.querySelector(container);
            return el ? el.getBoundingClientRect().width : null;
        };

        function swiperCreator(options) {
            var swiper = new Swiper(options.container, {
                width: exactWidth(options.container),
                slidesPerView: 1,
                loop: true,
                autoplay: {
                    delay: 3000,
                    disableOnInteraction: false,
                },
                speed: 700,
            });

            return swiper;
        };

        function swiperCreatorFade(options) {
            var swiper = new Swiper(options.container, {
                width: exactWidth(options.container),
                slidesPerView: 1,
                effect: "fade",
                loop: true,
                autoplay: {
                    delay: 3000,
                    disableOnInteraction: false,
                },
                speed: 700,
                allowTouchMove: false,
            });

            return swiper;
        };

        if (typeof Swiper !== "undefined") {
            var swiper01 = swiperCreator({container: ".project_box .swiper01"});
            var swiper02 = swiperCreator({container: ".project_box .swiper02"});
            var swiper03 = swiperCreatorFade({container: ".project_box .swiper03"});
            var swiper04 = swiperCreatorFade({container: ".project_box .swiper04"});
            var swiper05 = swiperCreator({container: ".project_box .swiper05"});
            var swiper06 = swiperCreatorFade({container: ".project_box .swiper06"});
            var swiper07 = swiperCreator({container: ".project_box .swiper07"});
            var swiper08 = swiperCreatorFade({container: ".project_box .swiper08"});
            var swiper09 = swiperCreator({container: ".project_box .swiper09"});
            var swiper10 = swiperCreatorFade({container: ".project_box .swiper10"});
            var swiper11 = swiperCreator({container: ".project_box .swiper11"});
        }

        /* 이미지 줌인 */
        document.querySelectorAll(".project_box .img_box").forEach(function (el) {
            var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        el.classList.add("on");
                    };
                });
            }, {
                threshold: 0.3
            });

            observer.observe(el);
        });

        /* 영상 */
        var video = document.querySelector(".project_box .p_sec02 video");
        if (video) {
            video.muted = true;
            var p = video.play();
            if (p && p.catch) p.catch(function () { video.setAttribute("controls", ""); });
        }

        /* 이미지맵 */
        imageMapResize();
    });
</script>
