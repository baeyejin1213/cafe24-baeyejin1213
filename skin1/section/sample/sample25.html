<script>
    $(document).ready(function () {
        /* swiper */
        function exactWidth(container) {
            var el = document.querySelector(container);
            return el ? el.getBoundingClientRect().width : null;
        };

        function swiperCreator(options) {
            var swiper = new Swiper(options.container, {
                width: exactWidth(options.container),
                slidesPerView: 1,
                loop: true,
                autoplay: {
                    delay: 3000,
                    disableOnInteraction: false,
                },
                speed: 700,
            });

            return swiper;
        };

        if (typeof Swiper !== "undefined") {
            var swiper01 = swiperCreator({container: ".project_box .swiper01"});
            var swiper02 = swiperCreator({container: ".project_box .swiper02"});
            var swiper03 = swiperCreator({container: ".project_box .swiper03"});
            var swiper04 = swiperCreator({container: ".project_box .swiper04"});
            var swiper05 = swiperCreator({container: ".project_box .swiper05"});
            var swiper06 = swiperCreator({container: ".project_box .swiper06"});
        }

        /* 영상 */
        var video = document.querySelector(".project_box .p_sec02 video");
        if (video) {
            video.muted = true;
            var p = video.play();
            if (p && p.catch) p.catch(function () { video.setAttribute("controls", ""); });
        }

        /* 이미지맵 */
        imageMapResize();
    });
</script>
