<style>
    /* 공통 */
    #container #contents {max-width: none; padding: 0;}
    .project_box {overflow: hidden;}
    .project_box > div {position: relative; font-size: 0; line-height: 0;}

    .project_box .p_sec02 .video01 {top: 25.9121%;}
    .project_box .p_sec02 .video02 {top: 71.6748%;}
    .project_box .p_sec02 video {display: block; width: 100%; height: 100%; object-fit: cover;}

    /* 기획전 섹션 03 */
    .project_box .p_sec03 .swiper01 {top: 23.1987%;}
    .project_box .p_sec03 .swiper-slide {width: 65.2778%;}
</style>

<script>
    $(document).ready(function () {
        /* swiper */
        if (typeof Swiper !== "undefined") {
            var swiper01 = new Swiper(".project_box .swiper01", {
                slidesPerView: "auto",
                loop: true,
                autoplay: {
                    delay: 3000,
                    disableOnInteraction: false,
                },
                speed: 700,
            });

            window.addEventListener("resize", function () {
                swiper01.update();
            });
        }

        /* 영상 */
        document.querySelectorAll(".project_box video").forEach(function (video) {
            video.muted = true;
            var p = video.play();
            if (p && p.catch) p.catch(function () { video.setAttribute("controls", ""); });
        });

        /* 이미지맵 */
        var mapImgs = document.querySelectorAll(".project_box img[usemap]");

        function mapResize(img) {
            if (!img.naturalWidth) return;
            var ratio = img.clientWidth / img.naturalWidth;
            document.querySelectorAll('map[name="' + img.getAttribute("usemap").slice(1) + '"] area').forEach(function (area) {
                if (!area.dataset.coords) area.dataset.coords = area.getAttribute("coords");
                area.setAttribute("coords", area.dataset.coords.split(",").map(function (v) { return Math.round(v * ratio); }).join(","));
            });
        };

        function imageMapResize() {
            mapImgs.forEach(mapResize);
        };

        mapImgs.forEach(function (img) {
            if (img.complete) mapResize(img);
            img.addEventListener("load", function () { mapResize(img); });
        });

        window.addEventListener("load", imageMapResize);
        window.addEventListener("resize", imageMapResize);
    });
</script>
