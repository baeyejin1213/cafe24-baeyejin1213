<script>
    $(document).ready(function () {
        /* swiper */
        function exactWidth(container) {
            return document.querySelector(container).getBoundingClientRect().width;
        };

        function swiperCreator(options) {
            var swiper = new Swiper(options.container, {
                width: exactWidth(options.container),
                slidesPerView: 1,
                effect: "fade",
                allowTouchMove: false,
                loop: true,
                autoplay: {
                    delay: 3000,
                    disableOnInteraction: false,
                },
                speed: 1000,
            });

            return swiper;
        };

        if (typeof Swiper !== "undefined") {
            var swiper01 = swiperCreator({container: ".project_box .swiper01"});
            var swiper02 = swiperCreator({container: ".project_box .swiper02"});
            var swiper03 = swiperCreator({container: ".project_box .swiper03"});
            var swiper04 = swiperCreator({container: ".project_box .swiper04"});
            var swiper05 = swiperCreator({container: ".project_box .swiper05"});
        }

        /* 이미지 줌인, 이미지 등장 */
        document.querySelectorAll(".project_box .img_box, .project_box .obj").forEach(function (el) {
            var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        el.classList.add("on");
                    };
                });
            }, {
                threshold: 0.3
            });

            observer.observe(el);
        });

        /* 이미지맵 */
        imageMapResize();
    });
</script>
