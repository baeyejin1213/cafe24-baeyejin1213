<style>
    /* 이 페이지만 전체 폭 사용 — 공통 #contents(max-width 1120 + 좌우 패딩) 해제 */

</style>

<script>
    /* 카페24 스크립트(Swiper 포함)는 본문 뒤에서 불러오므로 DOMContentLoaded 후 실행 */
    document.addEventListener("DOMContentLoaded", function () {
        /* swiper
           - Swiper 는 컨테이너 너비를 clientWidth(정수, 소수점 버림)로 재서 슬라이드 너비를 정함
             → 롤링 373.06px 은 슬라이드 373px(다음 슬라이드가 실틈으로 보임), 페이드 482.72px 은 482px(오른쪽 빈 틈)
           - width 옵션에 소수점까지 포함한 실제 너비를 넘겨 슬라이드가 컨테이너에 딱 맞게 함 (1720px 고정 페이지라 리사이즈 영향 없음) */
        function exactWidth(container) {
            var el = document.querySelector(container);
            return el ? el.getBoundingClientRect().width : null;
        };

        function swiperCreator(options) {
            var swiper = new Swiper(options.container, {
                width: exactWidth(options.container),
                slidesPerView: 1,
                loop: true,
                autoplay: {
                    delay: 3000,
                    disableOnInteraction: false,
                },
                speed: 700,
            });

            return swiper;
        };

        function swiperCreatorFade(options) {
            var swiper = new Swiper(options.container, {
                width: exactWidth(options.container),
                slidesPerView: 1,
                effect: "fade",
                loop: true,
                autoplay: {
                    delay: 3000,
                    disableOnInteraction: false,
                },
                speed: 700,
                allowTouchMove: false,
            });

            return swiper;
        };

        if (typeof Swiper !== "undefined") {
            var swiper01 = swiperCreator({container: ".project_box .swiper01"});
            var swiper02 = swiperCreatorFade({container: ".project_box .swiper02"});
            var swiper03 = swiperCreatorFade({container: ".project_box .swiper03"});
            var swiper04 = swiperCreator({container: ".project_box .swiper04"});
            var swiper05 = swiperCreator({container: ".project_box .swiper05"});
            var swiper06 = swiperCreatorFade({container: ".project_box .swiper06"});
            var swiper07 = swiperCreatorFade({container: ".project_box .swiper07"});
            var swiper08 = swiperCreator({container: ".project_box .swiper08"});
            var swiper09 = swiperCreator({container: ".project_box .swiper09"});
            var swiper10 = swiperCreatorFade({container: ".project_box .swiper10"});
        }

        /* 영상 : 자동재생이 막히면(저전력 모드 등) 재생 버튼 노출 */
        var video = document.querySelector(".project_box .p_sec01 video");
        if (video) {
            video.muted = true;
            var p = video.play();
            if (p && p.catch) p.catch(function () { video.setAttribute("controls", ""); });
        }
    });
</script>
