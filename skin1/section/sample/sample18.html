<style>
    /* 공통 */
    #container #contents {max-width: 100%; padding: 0; margin-left: 0;}
    #project_wrap {background-color: #fff; color: #000; overflow-x: clip; word-break: keep-all;}
    #project_wrap *,
    #project_wrap *::before,
    #project_wrap *::after {box-sizing: border-box;}
    #project_wrap img {display: block; width: 100%; max-width: none;}
    #project_wrap * {font-family: "Pretendard Variable", "Pretendard", sans-serif; letter-spacing: -0.02em;}
    #project_wrap .denim,
    #project_wrap .denim * {font-family: "DenimINKWD", "Pretendard Variable", "Pretendard", sans-serif;}

    /* 섹션 01 */
    #project_wrap .sec01 {position: relative; background-color: #262626;}
    #project_wrap .sec01 .txt {position: absolute; top: 5.214%; bottom: 5.028%; left: 0; right: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: center; color: #fff; text-align: center; white-space: nowrap;}
    #project_wrap .sec01 .txt .t01,
    #project_wrap .sec01 .txt .t03 {font-size: 16px; line-height: 20px; font-weight: 400;}
    #project_wrap .sec01 .txt .t02 {font-size: min(64px, 15.92vw); line-height: 0.969; font-weight: 500;}

    /* 섹션 02 */
    #project_wrap .sec02 {padding-top: 30px; background-color: #262626; display: flex; flex-direction: column; gap: 32px;}
    #project_wrap .sec02 .row {display: flex;}
    #project_wrap .sec02 .row .img {width: 50%;}
    #project_wrap .sec02 .row .img.full {width: 100%;}
    #project_wrap .sec02 .row .img.white {background-color: #fff;}
    #project_wrap .sec02 .desc {padding: 20px 20px 64px;}
    #project_wrap .sec02 .desc .t01 {font-size: 14px; line-height: 20px; font-weight: 400; color: #fff; text-align: center;}
    #project_wrap .sec02 .desc .t01 .denim {font-weight: 500;}

    /* 섹션 03 */
    #project_wrap .sec03 {padding: 80px 0; display: flex; justify-content: center;}
    #project_wrap .sec03 .brand {width: 93px; line-height: 0;}
    #project_wrap .sec03 .brand svg {display: block; width: 100%; height: auto;}

    /* animation */
    #project_wrap .fadeEl {opacity: 0;}
    #project_wrap .fadeEl.animated {opacity: 1;}
    #project_wrap .fadeEl.animated .fadeCh {animation: 1s ease both;}
    #project_wrap .fadeEl.animated .fadeIn {animation-name: m_fadeIn;}
    #project_wrap .fadeEl.animated .fadeInUp {animation-name: m_fadeInUp;}

    @keyframes m_fadeIn {
        0% {opacity: 0;}
        100% {opacity: 1;}
    }

    @keyframes m_fadeInUp {
        0% {opacity: 0; transform: translateY(20px);}
        100% {opacity: 1; transform: translateY(0);}
    }
</style>

<script>
    $(document).ready(function () {
        /* animation */
        $("#project_wrap .fadeEl").each(function () {
            const $this = $(this);
            const thisOffset = 200;

            $(window).on("scroll load", function () {
                let isDone = false;

                if ($(this).scrollTop() + $(this).innerHeight() <= $this.offset().top) {
                    $this.removeClass("animated");
                    isDone = false;
                } else if ($(this).scrollTop() + $(this).innerHeight() - thisOffset >= $this.offset().top) {
                    if (!isDone) {
                        $this.addClass("animated");
                        isDone = true;
                    };
                };
            });
        });
    });
</script>
