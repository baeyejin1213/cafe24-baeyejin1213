<style>
    #container #contents {max-width: none !important;padding: 0 !important;}
</style>


<div class="path" module="product_headcategory">
    <span>현재 위치</span>
    <ol>
        <li><a href="/">홈</a></li>
        <li class="{$disp_cate_1|display}"><a href="{$link_product_list_1}">{$name_1}</a></li>
        <li class="{$disp_cate_2|display}"><a href="{$link_product_list_2}">{$name_2}</a></li>
        <li class="{$disp_cate_3|display}"><a href="{$link_product_list_3}">{$name_3}</a></li>
        <li class="{$disp_cate_4|display}"><strong><a href="{$link_product_list_4}">{$name_4}</a></strong></li>
    </ol>
</div>


<div class="list_inner">
    <div class="lsit_title" module="product_headcategory">
        <div class="title_wrap">
            <div module="Layout_MobileAction">
                <a href="#none" onclick="{$go_back}"><img src="/morenvyimg/back_arr.png" alt="뒤로가기"></a>
            </div>
            <h2>{$title_text_or_image}</h2>
            <span class="likeButton {$disp_likecate_class}">LIKE IT !<button
                    type="button">{$disp_likecate_icon}{$disp_likecate_count}</button></span>
        </div>
    </div>
</div>

<div class="swiper swiper_title_tab">
    <ul class="title_tab swiper-wrapper">
        <li module="product_displaycategory" style="display:{$display};" class="{$selected} swiper-slide">
            <a href="{$link_product_list_sub}" class="t02">{$category_name}</a>
        </li>
    </ul>
</div>

<div class="list_inner">
    <div module="product_headcategory" class="product_top_image">{$top_image1_tag}{$top_image2_tag}{$top_image3_tag}</div>
</div>

<div module="product_listrecommend" class="ec-base-product">
    <!--@css(/css/module/product/listrecommend_swipe.css)-->
    <!--
		$count = 7
	-->

    <div class="title_box">
        <!-- 분류 : 추천상품 타이틀 -->
        <!--@import(/section/list_recmd_title.html)-->

        <div class="swiper_btn_wrap">
            <div class="swiper-button-prev swiper-button-prev-recmd"></div>
            <div class="swiper-button-next swiper-button-next-recmd"></div>
        </div>
    </div>
    <div class="inner">
        <div class="swiper swiper-recmd">
            <ul class="prdList swiper-wrapper">
                <!--@import(/product/list_product.html)-->
            </ul>
        </div>
    </div>


    <!-- <div class="swiper-pagination swiper-pagination-recmd"></div> -->
</div>

<div module="product_listnew" class="ec-base-product">
    <!--@css(/css/module/product/listrecommend_swipe.css)-->
    <!--
		$count = 7
	-->
    <div class="title_box">
        <!-- 분류 : 신상품 타이틀 -->
        <!--@import(/section/list_new_title.html)-->

        <div class="swiper_btn_wrap">
            <div class="swiper-button-prev swiper-button-prev-newprd"></div>
            <div class="swiper-button-next swiper-button-next-newprd"></div>
        </div>
    </div>
    <div class="inner">
        <div class="swiper swiper-newprd">
            <ul class="prdList swiper-wrapper">
                <!--@import(/product/list_product.html)-->
            </ul>
        </div>
    </div>

    <!-- <div class="swiper-pagination swiper-pagination-newprd"></div> -->

<div class="list_inner">
    <!--@import(/product/shoppQ/searchContent.html)-->

    <div module="product_normalpackage">
        <!--@css(/css/module/product/listnormal.css)-->
        <!--@js(/js/module/product/normalmenu.js)-->
        <div module="product_normalmenu">
            <!--
			$compare_page = /product/compare.html
		-->
            <div class="function" id="{$listmenu_position}">
                <p class="prdCount">상품 <span class="txtEm">{$total_count}</span> 개</p>
                <div class="sort">
                    <select id="selArray" name="selArray" module="product_Orderby">
                        <option value>- 정렬방식 -</option>
                        <option value="{$param}">{$sort_name}</option>
                        <option value="{$param}">{$sort_name}</option>
                    </select>

                    <!-- 정렬 방식 커스텀 -->
                    <ul class="custom_sort"></ul>
                    <!-- 정렬 방식 커스텀 -->

                    <div class="btnWrap">
                        <a href="/product/list.html{$params}" class="list_btn "><!--@import(/morenvyimg/list_btn.svg)-->리스트 화면으로 보기</a>
                        <div class="line"></div>
                        <a href="/product/list_thumb.html{$params}" class="thumbnail_btn active"><!--@import(/morenvyimg/thumbnail_btn.svg)-->썸네일 화면으로 보기</a>
                    </div>
                </div>
            </div>

            <fieldset class="condition {$select_search_display|display}">
                <legend>조건별 검색</legend>
                <p>
                    <!--@js(/js/module/product/product_selectsearch.js)-->
                    <select class="FirstSelect" module="product_FirstSelect">
                        <option value>-조건선택-</option>
                        <option value="{$value}" {$selected}>{$title}</option>
                        <option value="{$value}" {$selected}>{$title}</option>
                    </select>
                    <select class="SecondSelect" module="product_SecondSelect">
                        <option value>-조건선택-</option>
                        <option value="{$value}" {$selected}>{$title}</option>
                        <option value="{$value}" {$selected}>{$title}</option>
                    </select>
                    <a href="#SelectSearch" class="btnSubmitFix">검색</a>
                </p>
            </fieldset>
        </div>

        <div module="product_listnormal" class="ec-base-product">
            <!--
			    $count = 12
                $cache =  yes
                $moreview = yes
			    ※ 상품진열갯수를 설정하는 변수입니다. 설정하지 않을 경우, 최대 200개의 상품이 진열 됩니다.
			    ※ 진열된 상품이 많으면, 쇼핑몰에 부하가 발생할 수 있습니다.
            
			    $basket_result = /product/add_basket.html
			    $basket_option = /product/basket_option.html
		    -->
            <ul class="prdList on">
                <!--@import(/product/list_product.html)-->
            </ul>
        </div>
    </div>

    <div module="product_listmore" class="more">
		<a href="#none" onclick="{$more_action}" class="btnMore">
            <div class="txt">
                <span>더 보기</span>
                <span>(<span id="more_current_page">{$current_page}</span>/<span id="more_total_page">{$total_page}</span>)</span>
            </div>
            <!--@import(/morenvyimg/list_more.svg)-->
		</a>
	</div>
