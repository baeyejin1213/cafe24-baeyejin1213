<!--@layout(/layout/basic/layout.html)-->
<!--@css(/morenvy/css/main.css)-->
<!--@js(/morenvy/js/jquery.plugin.min.js)-->
<!--@js(/morenvy/js/jquery.countdown.min.js)-->
<!--@js(/morenvy/js/countdown_start.js)-->
<!--@js(/js/module/product/menucategory.js)-->
<!--@css(/css/module/product/menupackage.css)-->

<!--@js(/morenvy/js/product_list.js)-->

<style>
    #container #contents {max-width: 100%; padding: 0;}
</style>


<!-- 목록 : 위치 · 타이틀 -->
<div class="list_title" module="product_headcategory">
    <div class="path">
        <span>현재 위치</span>
        <ol>
            <li><a href="/">홈</a></li>
            <li class="{$disp_cate_1|display}"><a href="{$link_product_list_1}">{$name_1}</a></li>
            <li class="{$disp_cate_2|display}"><a href="{$link_product_list_2}">{$name_2}</a></li>
            <li class="{$disp_cate_3|display}"><a href="{$link_product_list_3}">{$name_3}</a></li>
            <li class="{$disp_cate_4|display}"><strong><a href="{$link_product_list_4}">{$name_4}</a></strong></li>
        </ol>
    </div>

    <div class="title_top">
        <div module="Layout_MobileAction" class="btn_back">
            <a href="#none" onclick="{$go_back}"><img src="/morenvyimg/blk_arr_d.svg" alt="뒤로가기"></a>
        </div>
        <!-- 상위 분류 > 현재 분류 (상위 분류는 product_list.js 에서 위치 정보로 채움) -->
        <h2><span class="parent"></span><span class="cur">{$title_text_or_image}</span></h2>
        <span class="prd_count title_count"></span>
    </div>
</div>


<!-- 목록 : 하위 분류 -->
<div class="list_tab">
    <ul>
        <li module="product_displaycategory" style="display:{$display};" class="{$selected}">
            <a href="{$link_product_list_sub}">{$category_name} <span class="prd_count {$product_count_display|display}">{$product_count}</span></a>
        </li>
    </ul>
</div>


<!-- 목록 : 분류 상단 이미지 (관리자 > 상품 분류 관리 > 분류 꾸미기 > 상단 이미지 / 이미지 1 = PC, 이미지 2 = 모바일) -->
<div class="list_ban">
    <div module="product_headcategory" class="product_top_image">{$top_image1_tag}{$top_image2_tag}{$top_image3_tag}</div>
</div>


<!-- 목록 : 추천상품 (관리자 > 상품 진열 > 분류 추천상품) -->
<div class="list_rolling list_recmd m_prd prd_rolling">
    <div class="list_sec_title">
        <!-- 분류 : 추천상품 타이틀 -->
        <!--@import(/section/list_recmd_title.html)-->
    </div>

    <div module="product_listrecommend" class="main_prd">
        <!--
            $count = 12
        -->
        <div class="ec-base-product swiper prd_swiper">
            <ul class="prdList swiper-wrapper">
                <!--@import(/product/product_list.html)-->
            </ul>
        </div>
    </div>
    <div class="swiper-pagination swiper-pagination-prd"></div>
</div>


<!-- 목록 : 신상품 (관리자 > 상품 진열 > 분류 신상품) -->
<div class="list_rolling list_new m_prd prd_rolling">
    <div class="list_sec_title">
        <!-- 분류 : 신상품 타이틀 -->
        <!--@import(/section/list_new_title.html)-->
    </div>

    <div module="product_listnew" class="main_prd">
        <!--
            $count = 12
        -->
        <div class="ec-base-product swiper prd_swiper">
            <ul class="prdList swiper-wrapper">
                <!--@import(/product/product_list.html)-->
            </ul>
        </div>
    </div>
    <div class="swiper-pagination swiper-pagination-prd"></div>
</div>


<!-- 목록 : 전체 상품 -->
<div class="list_prd m_prd">
    <!--@import(/product/shoppQ/searchContent.html)-->

    <div module="product_normalpackage" class="main_prd">
        <!--@css(/css/module/product/listnormal.css)-->
        <!--@js(/js/module/product/normalmenu.js)-->
        <div module="product_normalmenu">
            <!--
			    $compare_page = /product/compare.html
		    -->
            <div class="function" id="{$listmenu_position}">
                <p class="prdCount"><span class="prd_count">{$total_count}</span>개 상품</p>
                <div class="sort">
                    <!-- 모바일 : 선택형 -->
                    <select id="selArray" name="selArray" module="product_Orderby">
                        <option value>상품 정렬</option>
                        <option value="{$param}">{$sort_name}</option>
                        <option value="{$param}">{$sort_name}</option>
                    </select>
                    <!-- PC : 글자형 -->
                    <ul id="type" module="product_Orderby">
                        <li><a href="{$param}" {$style}>{$sort_name}</a></li>
                        <li><a href="{$param}" {$style}>{$sort_name}</a></li>
                    </ul>
                </div>
            </div>

            <fieldset class="condition {$select_search_display|display}">
                <legend>조건별 검색</legend>
                <p>
                    <!--@js(/js/module/product/product_selectsearch.js)-->
                    <select class="FirstSelect" module="product_FirstSelect">
                        <option value>-조건선택-</option>
                        <option value="{$value}" {$selected}>{$title}</option>
                        <option value="{$value}" {$selected}>{$title}</option>
                    </select>
                    <select class="SecondSelect" module="product_SecondSelect">
                        <option value>-조건선택-</option>
                        <option value="{$value}" {$selected}>{$title}</option>
                        <option value="{$value}" {$selected}>{$title}</option>
                    </select>
                    <a href="#SelectSearch" class="btnSubmitFix">검색</a>
                </p>
            </fieldset>
        </div>

        <div module="product_listnormal" class="ec-base-product">
            <!--
			    $count = 20
                $cache =  no
                $moreview = yes
			    ※ 상품진열갯수를 설정하는 변수입니다. 설정하지 않을 경우, 최대 200개의 상품이 진열 됩니다.
			    ※ 진열된 상품이 많으면, 쇼핑몰에 부하가 발생할 수 있습니다.

			    $basket_result = /product/add_basket.html
			    $basket_option = /product/basket_option.html
		    -->
            <ul class="prdList prdList_normal">
                <!--@import(/product/product_list.html)-->
            </ul>
        </div>
    </div>

    <div module="product_listmore" class="more">
		<a href="#none" onclick="{$more_action}" class="btnMore">
            <span class="txt">더 보기 (<span id="more_current_page">{$current_page}</span>/<span id="more_total_page">{$total_page}</span>)</span><img src="/morenvyimg/cs_arr_d.svg" alt="">
		</a>
	</div>
</div>
