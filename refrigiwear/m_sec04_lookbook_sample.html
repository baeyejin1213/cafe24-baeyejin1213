<script>
/* ======================= [3] JS : main.js "}); // 시작 코드 블럭 종료" 바로 위 ======================= */

    /* 메인 04 : STYLED BY REFRIGIWEAR 룩북 */
    (function ($) {
        var $sec = $('main > .m_sec04');
        var $area = $sec.find('.morenvy-banner-area');

        if (!$area.length) return;

        // 툴팁(PC 호버)·라이트박스 : swiper overflow에 잘리지 않게 body에 만듦
        var $tip = $(
            '<a href="#" class="look_tip">' +
                '<span class="thumb"><img alt=""></span>' +
                '<span class="txt"><strong class="name"></strong><span class="price"></span></span>' +
            '</a>'
        ).appendTo('body');

        var $layer = $(
            '<div class="look_layer">' +
                '<div class="dim"></div>' +
                '<span class="count"></span>' +
                '<button type="button" class="btn_close">닫기</button>' +
                '<button type="button" class="btn_prev">이전</button>' +
                '<button type="button" class="btn_next">다음</button>' +
                '<div class="layer_box">' +
                    '<div class="img">' +
                        '<img alt="">' +
                        '<button type="button" class="btn_shop">SHOP THE LOOK</button>' +
                    '</div>' +
                    '<div class="prd">' +
                        '<div class="prd_head">' +
                            '<strong>SHOP THE LOOK</strong>' +
                            '<button type="button" class="btn_prd_close">닫기</button>' +
                        '</div>' +
                        '<ul class="prd_list"></ul>' +
                    '</div>' +
                '</div>' +
            '</div>'
        ).appendTo('body');
        var $layerImg = $layer.find('.layer_box > .img');
        var $layerPrd = $layer.find('.prd');
        var $prdList = $layer.find('.prd_list');

        var pcQuery = window.matchMedia('(min-width:1025px) and (hover:hover)');
        var title = $.trim($sec.find('.main_title h2').text());
        var looks = [];
        var prdCache = {};
        var lookSwiper = null;
        var current = 0;
        var tipNo = null;
        var tipTimer = null;

        function isPc() {
            return pcQuery.matches;
        }

        // 미리보기 스킨에서는 카페24가 이 주소 앞에 /skin-skin1 을 자동으로 붙여 줌 (직접 붙이면 두 번 겹침)
        function productUrl(no) {
            return '/product/detail.html?product_no=' + no;
        }

        function priceHtml(prd) {
            if (!prd.sale) return '';

            var won = function (n) { return Number(n).toLocaleString('ko-KR') + '원'; };

            return (prd.price > prd.sale ? '<del>' + won(prd.price) + '</del>' : '') + won(prd.sale);
        }

        /* 상품 정보 : 상세페이지 메타(og:title, og:image, product:price) */
        function getProduct(no) {
            if (prdCache[no]) return prdCache[no];

            prdCache[no] = fetch(productUrl(no), { credentials: 'same-origin' })
                .then(function (res) { return res.text(); })
                .then(function (html) {
                    var doc = new DOMParser().parseFromString(html, 'text/html');
                    var meta = function (name) {
                        var el = doc.querySelector('meta[property="' + name + '"]');
                        return el ? el.getAttribute('content') : '';
                    };
                    var name = meta('og:title');
                    var site = meta('og:site_name');

                    // og:title = "상품명 - 사이트명"
                    if (site && name.slice(-(site.length + 3)) === ' - ' + site) {
                        name = name.slice(0, -(site.length + 3));
                    }

                    if (!name) return null;

                    var price = +meta('product:price:amount') || 0;

                    return {
                        no: no,
                        name: name,
                        img: meta('og:image'),
                        price: price,
                        sale: +meta('product:sale_price:amount') || price,
                        url: productUrl(no)
                    };
                })
                .catch(function () { return null; });

            return prdCache[no];
        }

        /* 핫스팟 그리기 */
        function drawSpots($box, spots, onTap) {
            $box.find('.spot').remove();

            $.each(spots, function (i, spot) {
                var $spot = $('<button type="button" class="spot">상품 보기</button>')
                    .css({ left: spot.x + '%', top: spot.y + '%' });

                $spot.on('mouseenter', function () {
                    if (isPc()) showTip(this, spot.no);
                });
                $spot.on('mouseleave', function () {
                    hideTip(150);
                });
                $spot.on('click', function (e) {
                    e.stopPropagation();

                    if (isPc()) {
                        location.href = productUrl(spot.no);
                    } else if (onTap) {
                        onTap(this, spot.no);
                    }
                });

                $box.append($spot);
            });
        }

        /* 툴팁 (PC 호버) */
        function showTip(spotEl, no) {
            clearTimeout(tipTimer);
            tipNo = no;

            getProduct(no).then(function (prd) {
                if (tipNo !== no || !prd) return;

                var rect = spotEl.getBoundingClientRect();
                var w = $tip.outerWidth();
                var h = $tip.outerHeight();
                var center = rect.left + rect.width / 2;
                var left = Math.max(10, Math.min(center - w / 2, window.innerWidth - w - 10));
                var top = rect.top - h - 12;
                var down = top < 10;

                if (down) top = rect.bottom + 12;

                $tip.attr('href', prd.url);
                $tip.find('.thumb img').attr({ src: prd.img, alt: prd.name });
                $tip.find('.name').text(prd.name);
                $tip.find('.price').html(priceHtml(prd));
                $tip.css({ left: left + 'px', top: top + 'px' });
                $tip[0].style.setProperty('--arrow', (center - left) + 'px');
                $tip.toggleClass('down', down).addClass('on');
            });
        }

        function hideTip(delay) {
            clearTimeout(tipTimer);

            tipTimer = setTimeout(function () {
                tipNo = null;
                $tip.removeClass('on');
            }, delay || 0);
        }

        $tip.on('mouseenter', function () { clearTimeout(tipTimer); });
        $tip.on('mouseleave', function () { hideTip(150); });
        $(window).on('scroll', function () { hideTip(0); });

        /* 라이트박스 */
        function togglePrd(show) {
            $layerPrd.toggleClass('show', !!show);
        }

        function renderLayer() {
            var look = looks[current];
            var nos = [];
            var index = current;

            hideTip(0);
            togglePrd(false);

            $layerImg.children('img').attr({ src: look.src, alt: look.alt });
            $layer.find('.count').text((current + 1) + ' / ' + looks.length);
            // 모바일 : 라이트박스 안 점을 누르면 툴팁 (같은 점을 다시 누르면 닫힘)
            drawSpots($layerImg, look.spots, function (spotEl, no) {
                if ($tip.hasClass('on') && tipNo === no) {
                    hideTip(0);
                } else {
                    showTip(spotEl, no);
                }
            });

            // 같은 상품번호는 목록에 한 번만
            $.each(look.spots, function (i, spot) {
                if ($.inArray(spot.no, nos) < 0) nos.push(spot.no);
            });

            $prdList.html($.map(nos, function () {
                return '<li class="loading"><span class="thumb"></span><div class="txt"></div></li>';
            }).join(''));
            $layerPrd.scrollTop(0);

            $.each(nos, function (i, no) {
                getProduct(no).then(function (prd) {
                    if (index !== current) return;

                    var $li = $prdList.children().eq(i);

                    if (!prd) {
                        $li.hide();
                        return;
                    }

                    $li.removeClass('loading').html(
                        '<a href="' + prd.url + '" class="thumb"><img src="' + prd.img + '" alt=""></a>' +
                        '<div class="txt">' +
                            '<a href="' + prd.url + '" class="name"></a>' +
                            '<p class="price">' + priceHtml(prd) + '</p>' +
                            '<a href="' + prd.url + '" class="btn_more">SHOP NOW</a>' +
                        '</div>'
                    );
                    $li.find('.name').text(prd.name);
                });
            });
        }

        function openLayer(i) {
            current = i;
            $layer.toggleClass('single', looks.length < 2);
            renderLayer();
            $layer.addClass('on');
            $('html').addClass('look_open');
        }

        function closeLayer() {
            hideTip(0);
            togglePrd(false);
            $layer.removeClass('on');
            $('html').removeClass('look_open');
        }

        function moveLayer(dir) {
            current = (current + dir + looks.length) % looks.length;
            renderLayer();
        }

        $layer.find('.btn_close').on('click', closeLayer);
        $layer.find('.btn_prev').on('click', function () { moveLayer(-1); });
        $layer.find('.btn_next').on('click', function () { moveLayer(1); });
        $layer.find('.btn_shop').on('click', function (e) {
            e.stopPropagation();
            hideTip(0);
            togglePrd(true);
        });
        // 이미지 다른 곳을 누르면 툴팁 닫힘
        $layerImg.on('click', function () { hideTip(0); });
        $layer.find('.btn_prd_close').on('click', function () { togglePrd(false); });
        $layer.find('.dim').on('click', function () {
            if ($layerPrd.hasClass('show')) {
                togglePrd(false);
            } else {
                closeLayer();
            }
        });

        $(document).on('keydown', function (e) {
            if (!$layer.hasClass('on')) return;

            if (e.key === 'Escape') closeLayer();
            if (e.key === 'ArrowLeft' && looks.length > 1) moveLayer(-1);
            if (e.key === 'ArrowRight' && looks.length > 1) moveLayer(1);
        });

        // 모바일 : 좌우로 밀어 넘기기
        var touchX = null;

        $layerImg.on('touchstart', function (e) {
            touchX = e.originalEvent.touches[0].clientX;
        });
        $layerImg.on('touchend', function (e) {
            if (touchX === null || looks.length < 2) return;

            var dx = e.originalEvent.changedTouches[0].clientX - touchX;

            touchX = null;

            if (Math.abs(dx) > 50) moveLayer(dx < 0 ? 1 : -1);
        });

        /* 배너관리자 출력 읽기 → 핫스팟·Swiper */
        function initLook() {
            $area.find('.morenvy-banner').each(function () {
                var $banner = $(this);
                var $img = $banner.find('.img img');

                if (!$img.length) {
                    $banner.remove();
                    return;
                }

                var spots = [];
                var index = looks.length;

                // 타이틀·텍스트 1~3 = "상품번호|가로%|세로%" (비었거나 형식이 다르면 건너뜀)
                $banner.find('.spot_data li').each(function () {
                    var val = $.trim($(this).text()).split('|');
                    var no = parseInt(val[0], 10);
                    var x = parseFloat(val[1]);
                    var y = parseFloat(val[2]);

                    if (val.length < 3 || !no || isNaN(x) || isNaN(y)) return;

                    spots.push({ no: no, x: x, y: y });
                });

                $img.attr('alt', title + ' ' + (index + 1));
                looks.push({ src: $img[0].currentSrc || $img.attr('src'), alt: $img.attr('alt'), spots: spots });

                drawSpots($banner.find('.img'), spots, function () { openLayer(index); });

                $banner.find('.img').on('click', function () {
                    // 드래그 끝에 열리지 않게
                    if (lookSwiper && lookSwiper.allowClick === false) return;

                    openLayer(index);
                });
            });

            if (!looks.length) {
                $sec.hide();
                return;
            }

            lookSwiper = new Swiper($sec.find('.look-swiper')[0], {
                /*
                 * 767px 이하 기본 옵션
                 */
                slidesPerView: 2,
                spaceBetween: 8,
                speed: 500,
                watchOverflow: true,
                observer: true,
                observeParents: true,

                breakpoints: {
                    /*
                     * 768px 이상
                     */
                    768: {
                        slidesPerView: 4,
                        spaceBetween: 16
                    }
                }
            });

            // 섹션이 보이기 직전에 상품 정보 미리 읽기
            if ('IntersectionObserver' in window) {
                var observer = new IntersectionObserver(function (entries) {
                    if (!entries[0].isIntersecting) return;

                    $.each(looks, function (i, look) {
                        $.each(look.spots, function (j, spot) { getProduct(spot.no); });
                    });
                    observer.disconnect();
                }, { rootMargin: '400px 0px' });

                observer.observe($sec[0]);
            }
        }

        // 배너관리자가 늦게 채우므로 init + 이미지가 들어올 때까지 기다림(최대 10초)
        var waitCount = 0;
        var waitTimer = setInterval(function () {
            waitCount++;

            if (($area.hasClass('init') && $area.find('.img img').length) || waitCount > 50) {
                clearInterval(waitTimer);
                initLook();
            }
        }, 200);
    })(jQuery);

/* ===================== // [3] JS ===================== */
</script>
